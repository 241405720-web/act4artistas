        body {
  margin:0;
  font-family: Arial, sans-serif;
  background-color: #696767; 
  color: #000000;
}
.container { padding:20px; }
.center { text-align:center; }
.logo { width:150px; margin:20px auto; }

.btn {
  background: #0071e3;
  color: rgb(255, 253, 253);
  padding:10px 20px;
  margin:10px;
  display:inline-block;
  border-radius:8px;
  text-decoration:none;
  transition: 0.2s;
}
.btn:hover { background: #005bb5; } 
.btn:active { background: #0071e3; }

.sidebar {
  width:200px;
  position:fixed;
  height:100%;
  background: #1d9947;
  padding-top:20px;
}
.sidebar a {
  display:block;
  color: #aeaeae;
  padding:10px;
  text-decoration:none;
}
.sidebar a:hover { 
  background: #0000f7; 
  color: #fff5f5;
}

.content { margin-left:220px; padding:20px; }

form {
  background: #0000fa; 
  padding:20px;
  border-radius:10px;
  max-width:500px;
  margin:auto;
}

input, select, textarea {
  width:100%;
  margin:8px 0;
  padding:8px;
  background: #0000ff; 
  border: none;
  color: rgb(241, 234, 234);
  border-radius: 6px;
  box-sizing: border-box;
}

footer {
  position:fixed;
  bottom:0;
  width:100%;
  background: #eeeef1;
  color: #eeeeee;
  text-align:center;
  padding:10px;
}
/* GRID DE TARJETAS */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

/* TARJETAS */
.card {
  background: #eeeef7;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  transition: 0.2s;
}

/* EFECTO FLOTANTE SUTIL */
.card:hover {
  background: #f7f6f6;
}

/* IMAGEN (PORTADA O ARTISTA) */
.card-img {
  width: 100px;
  height: 100px;
  border-radius: 8px;
  margin-bottom: 10px;
  object-fit: cover;
}
